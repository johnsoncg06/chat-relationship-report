name: build-installers
# 推到 main（改到程式檔）、打 tag（v*）或手動執行，都會編譯三個平台；
# 全部通過檢查後才會建立新版本 Release（版本號自動遞增），任何必要平台失敗就不發布。
on:
  push:
    branches: [main]
    paths: ['app.py', 'scripts/**', 'web/**', 'assets/**', 'installer.iss', 'requirements.txt', 'tests/**', '.github/workflows/build.yml']
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
env:
  PYI_COMMON: >-
    --noconfirm --windowed --name ChatRelationshipReport --icon assets/icon.png
    --hidden-import pandas --hidden-import numpy --hidden-import scipy.stats
    --hidden-import matplotlib.backends.backend_agg --collect-data matplotlib
    --exclude-module tkinter --exclude-module _tkinter --exclude-module matplotlib.backends.backend_tkagg --exclude-module matplotlib.backends.backend_qt5agg --exclude-module matplotlib.backends.backend_qtagg --exclude-module matplotlib.backends.backend_webagg --exclude-module matplotlib.backends.backend_wxagg --exclude-module matplotlib.backends.backend_gtk3agg --exclude-module matplotlib.backends.backend_macosx --exclude-module PyQt5 --exclude-module PyQt6 --exclude-module PySide2 --exclude-module PySide6 --exclude-module wx --exclude-module IPython --exclude-module jupyter --exclude-module notebook --exclude-module pytest --exclude-module sphinx --exclude-module numpy.tests --exclude-module pandas.tests --exclude-module scipy.tests --exclude-module matplotlib.tests
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - id: v
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then T="$GITHUB_REF_NAME"
          else
            LAST=$(git tag -l 'v0.1.*' --sort=-v:refname | head -1)
            N=$(( ${LAST##*.} + 1 )); [[ -z "$LAST" ]] && N=0
            T="v0.1.$N"
          fi
          echo "tag=$T" >> "$GITHUB_OUTPUT"; echo "將發布 $T"

  windows:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - run: pip install -r requirements.txt pyinstaller pillow
      - name: PyInstaller (onedir)
        shell: bash
        run: pyinstaller $PYI_COMMON --onedir --add-data "scripts;scripts" --add-data "web;web" app.py
      - name: 自我檢查（開啟 App、上傳合成聊天、跑完整流程）
        shell: bash
        run: |
          CHATREL_TOKEN=smoke NO_BROWSER=1 PORT=8799 ./dist/ChatRelationshipReport/ChatRelationshipReport.exe > app.log 2>&1 &
          RC=0
          timeout 240 python tests/smoke.py 8799 smoke > smoke.log 2>&1 || RC=$?
          taskkill //F //IM ChatRelationshipReport.exe > /dev/null 2>&1 || true
          cat smoke.log
          if [ "$RC" -ne 0 ]; then
            MSG=$( { echo "smoke rc=$RC"; cat smoke.log; echo "--- app.log ---"; tail -n 40 app.log; } | head -c 3000 | tr -d '\r' | sed -e ':a' -e 'N' -e '$!ba' -e 's/%/%25/g' -e 's/\n/%0A/g' )
            echo "::error title=Windows smoke failed::$MSG"
            exit 1
          fi
      - name: Inno Setup installer
        shell: bash
        run: |
          choco install innosetup -y --no-progress
          VER="${{ needs.version.outputs.tag }}"; VER="${VER#v}"
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" "//DAppVersion=$VER" installer.iss
          cp installer/ChatRelationshipReport-Setup-*.exe installer/ChatRelationshipReport-Windows-Setup.exe
      - name: Windows Defender 掃描（主程式與安裝程式）
        shell: pwsh
        run: |
          $mp = Join-Path $env:ProgramFiles 'Windows Defender\MpCmdRun.exe'
          & $mp -SignatureUpdate | Out-Null
          foreach ($f in @('dist\ChatRelationshipReport\ChatRelationshipReport.exe', 'installer\ChatRelationshipReport-Windows-Setup.exe')) {
            & $mp -Scan -ScanType 3 -File (Resolve-Path $f).Path -DisableRemediation
            if ($LASTEXITCODE -ne 0) { Write-Error "Defender 判定 $f 有威脅（結束碼 $LASTEXITCODE）"; exit 1 }
          }
      - uses: actions/upload-artifact@v5
        with: { name: windows-installer, path: installer/ChatRelationshipReport-Windows-Setup.exe }

  macos:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-latest,   arch: arm64 }   # Apple Silicon（M1 以後）
          - { runner: macos-15-intel, arch: intel }   # Intel Mac；失敗不擋發布，但該版本會缺檔
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    continue-on-error: ${{ matrix.arch == 'intel' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - run: pip install -r requirements.txt pyinstaller pillow
      - name: PyInstaller (.app)
        run: pyinstaller $PYI_COMMON --onedir --osx-bundle-identifier io.github.johnsoncg06.chatrelationshipreport --add-data "scripts:scripts" --add-data "web:web" app.py
      - name: 自我檢查（開啟 App、上傳合成聊天、跑完整流程）
        run: |
          CHATREL_TOKEN=smoke NO_BROWSER=1 PORT=8799 ./dist/ChatRelationshipReport.app/Contents/MacOS/ChatRelationshipReport > app.log 2>&1 &
          python tests/smoke.py 8799 smoke || { echo '--- app.log ---'; cat app.log; exit 1; }
      - name: Build .dmg
        run: |
          mkdir dmgroot && cp -R dist/ChatRelationshipReport.app dmgroot/ && ln -s /Applications dmgroot/Applications
          hdiutil create -volname "Chat Relationship Report" -srcfolder dmgroot -ov -format UDZO "ChatRelationshipReport-macOS-${{ matrix.arch }}.dmg"
      - uses: actions/upload-artifact@v5
        with: { name: "macos-dmg-${{ matrix.arch }}", path: "*.dmg" }

  release:
    needs: [version, windows, macos]
    if: success()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with: { path: assets, merge-multiple: true }
      - name: SHA256SUMS 與發布
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          cd assets && ls -l && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" \
            --notes "自動編譯並通過自我檢查。未簽章：Windows 會出現 SmartScreen、macOS 請按右鍵→打開。可用 SHA256SUMS.txt 核對檔案。" ./* \
            || gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber ./*
