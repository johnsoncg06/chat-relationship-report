<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>聊天關係報告</title>
<style>
:root{--base:#121212;--side:#000;--panel:#181818;--raise:#242424;--hover:#2a2a2a;--line:#2e2e2e;--ink:#fff;--mute:#b3b3b3;--dim:#7a7a7a;--g:#1ed760;--g2:#1db954;--warn:#f5a623;--bad:#f15e6c}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--base);color:var(--ink);font:14px/1.55 "Helvetica Neue",Helvetica,Arial,"PingFang TC","Microsoft JhengHei","Noto Sans CJK TC",sans-serif;display:flex;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--g);outline-offset:2px}
/* 側邊欄 */
aside{width:236px;flex:none;background:var(--side);padding:20px 12px;display:flex;flex-direction:column;gap:6px;margin:8px 0 8px 8px;border-radius:10px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 12px 18px;font-weight:800;font-size:17px;letter-spacing:-.2px}
.brand svg{width:30px;height:30px;flex:none}
nav{display:flex;flex-direction:column;gap:2px}
nav button{display:flex;align-items:center;gap:14px;padding:10px 12px;border-radius:6px;color:var(--mute);font-weight:700;text-align:left}
nav button:hover:not(:disabled){color:var(--ink)}nav button.on{color:var(--ink);background:var(--raise)}
nav button:disabled{opacity:.35;cursor:default}nav svg{width:22px;height:22px;flex:none;fill:currentColor}
.sp{flex:1}.quit{color:var(--dim);font-weight:700;padding:10px 12px;text-align:left;border-radius:6px;display:flex;gap:14px;align-items:center}.quit:hover{color:var(--ink)}
.priv{font-size:12px;color:var(--dim);padding:0 12px 10px}
/* 主區 */
main{flex:1;margin:8px;border-radius:10px;background:var(--panel);overflow-y:auto;position:relative;scroll-behavior:smooth}
.view{display:none}.view.on{display:block}
.hero{padding:56px 32px 28px;background:linear-gradient(180deg,#1f6b43 0%,#16402b 55%,var(--panel) 100%);display:flex;gap:26px;align-items:flex-end}
.hero.plain{background:linear-gradient(180deg,#2c2c2c,var(--panel))}
.cover{width:176px;height:176px;border-radius:6px;flex:none;background:linear-gradient(135deg,#1ed760,#0e5132);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 8px 40px rgba(0,0,0,.5)}
.cover b{font-size:68px;line-height:1;letter-spacing:-3px;color:#04200f}.cover span{font-size:13px;font-weight:700;color:#04200f;opacity:.75;margin-top:4px}
.hero h1{margin:6px 0 10px;font-size:clamp(30px,5vw,60px);line-height:1.05;letter-spacing:-1.5px;font-weight:900}
.hero .meta{color:#e5e5e5;font-size:14px}.hero .meta b{color:#fff}
.body{padding:20px 32px 56px;max-width:1040px}
h2{font-size:22px;letter-spacing:-.4px;margin:30px 0 14px;font-weight:800}
.sub{color:var(--mute);margin:-6px 0 14px}
.play{display:flex;gap:14px;align-items:center;margin:4px 0 0}
.go{background:var(--g);color:#000;font-weight:800;padding:14px 34px;border-radius:500px;font-size:15px;transition:transform .12s,background .12s}
.go:hover:not(:disabled){transform:scale(1.04);background:#3be477}.go:disabled{background:#3a3a3a;color:#777}
.ghost{border:1px solid #727272;border-radius:500px;padding:11px 24px;font-weight:700}.ghost:hover{border-color:#fff;transform:scale(1.03)}
.status{color:var(--mute)}
/* 匯入 */
.drop{border:2px dashed #3a3a3a;border-radius:12px;padding:44px 20px;text-align:center;color:var(--mute);cursor:pointer;background:#141414;transition:.15s}
.drop:hover,.drop.on{border-color:var(--g);color:#fff;background:#14201a}
.drop b{display:block;color:#fff;font-size:18px;margin-bottom:6px}
.files{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.chip{background:var(--raise);border-radius:500px;padding:5px 14px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
label{display:block;color:var(--mute);font-size:13px;font-weight:700;margin-bottom:6px}
input{width:100%;background:var(--raise);border:1px solid transparent;border-radius:6px;padding:11px 12px;color:#fff;font:inherit}
input:hover{border-color:#444}input:focus{outline:none;border-color:var(--g)}input::placeholder{color:#6a6a6a}input[type=date]{color-scheme:dark}
/* 卡片 */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.card{background:var(--raise);border-radius:8px;padding:18px;transition:background .15s}.card:hover{background:var(--hover)}
.card b{display:block;font-size:30px;letter-spacing:-1px;line-height:1.1}.card span{color:var(--mute);font-size:13px}
.alert{background:#2b2210;border-left:4px solid var(--warn);border-radius:6px;padding:12px 16px;margin:8px 0;color:#ffe2a8}
.alert.bad{background:#2b1418;border-color:var(--bad);color:#ffc4ca}
.alert h3{margin:0 0 4px;font-size:14px;color:#fff}
/* 排行表 */
table{width:100%;border-collapse:collapse}
th{color:var(--mute);font-weight:600;font-size:13px;text-align:left;padding:8px 12px;border-bottom:1px solid var(--line)}
td{padding:11px 12px;border-radius:0}tr.row:hover td{background:var(--hover)}tr.row td:first-child{border-radius:6px 0 0 6px;color:var(--mute);width:44px}tr.row td:last-child{border-radius:0 6px 6px 0}
tr.top td:nth-child(2){color:var(--g);font-weight:800}
.track{height:6px;background:#3a3a3a;border-radius:3px;position:relative;min-width:120px}.track i{position:absolute;inset:0 auto 0 0;background:var(--g);border-radius:3px}.track em{position:absolute;top:-3px;bottom:-3px;border-radius:2px;background:rgba(255,255,255,.28)}
tr.row:hover .track i{background:#3be477}
.pct{font-weight:800;white-space:nowrap}.pct small{color:var(--dim);font-weight:400}
.cur{color:var(--dim);font-weight:400;font-size:12px;margin-left:6px}
/* 維度 */
.dim{display:grid;grid-template-columns:70px 1fr 40px;gap:12px;align-items:center;margin:11px 0}.dim .track{height:8px}.dim b{text-align:right}
.note{color:var(--dim);font-size:12.5px;margin-top:12px}
ul.adv{margin:0;padding:0;list-style:none}ul.adv li{background:var(--raise);border-radius:8px;padding:14px 16px;margin-bottom:8px}
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.imgs figure{margin:0;background:#181818;border-radius:12px;overflow:hidden;transition:transform .15s}.imgs figure:hover{transform:translateY(-3px)}.imgs img{width:100%;display:block;cursor:zoom-in}
.empty{text-align:center;color:var(--mute);padding:70px 20px}.empty b{display:block;color:#fff;font-size:20px;margin-bottom:6px}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;z-index:9;padding:24px}.lb.on{display:flex}.lb img{max-width:100%;max-height:100%;border-radius:12px;background:#181818}
.spin{width:16px;height:16px;border:2px solid #444;border-top-color:var(--g);border-radius:50%;display:inline-block;vertical-align:-3px;margin-right:8px;animation:r 0.8s linear infinite}@keyframes r{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media(max-width:760px){body{flex-direction:column-reverse}aside{width:auto;flex-direction:row;margin:0 8px 8px;padding:6px;border-radius:10px;overflow-x:auto}.brand,.priv,.sp,.quit span{display:none}nav{flex-direction:row}nav button span{display:none}.hero{flex-direction:column;align-items:flex-start;padding:28px 20px 20px}.body{padding:16px 20px 40px}}
.hist td,.hist th{padding:8px 10px;font-size:13px;white-space:nowrap}.hist tr.row td:first-child{width:auto;color:inherit}.hist td:nth-child(6){white-space:normal}.hist select,.hist input.lb2{background:var(--raise);color:#fff;border:1px solid #333;border-radius:6px;padding:4px 6px;font:inherit;width:auto}.mini{background:var(--raise);border:1px solid #333;border-radius:500px;padding:5px 14px;font-size:12.5px;font-weight:700}.mini:hover{border-color:#fff}.mini.del:hover{border-color:var(--bad);color:var(--bad)}.up{color:var(--g)}.dn{color:var(--bad)}.grp{background:var(--raise);border-radius:10px;padding:16px 18px;margin:14px 0}details.ev{border:1px solid var(--line,#2a2a2a);border-radius:8px;padding:8px 12px;margin:6px 0}details.ev summary{cursor:pointer}.evl{font-size:13px;color:var(--sub,#b3b3b3);padding:4px 0;border-top:1px solid rgba(255,255,255,.06)}.evchip{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;border:1px solid var(--line,#ccc)}.ev-ea{background:#e6f0ff}.ev-w{background:#f3ecff}.ev-u{background:#f2f2f2;color:#666}.ev-tw{background:#e3f6e8}
select{width:100%;background:var(--raise);border:1px solid transparent;border-radius:6px;padding:11px 12px;color:#fff;font:inherit}select:hover{border-color:#444}select:focus{outline:none;border-color:var(--g)}p.sub b{font-size:inherit;color:#fff}
.c-cool{background:#3a1c20;color:#ffc4ca}.c-warm{background:#143222;color:#9ef0b8}.c-flat{background:#262626;color:#aaa}.c-na{background:#262626;color:#777}
.tbl tr.row td:first-child{width:auto;color:inherit}.tbl td,.tbl th{text-align:left;padding:8px 10px;font-size:13.5px;vertical-align:top}
</style></head>
<body>
<aside>
 <div class="brand"><svg viewBox="0 0 32 32"><circle cx="16" cy="15" r="13" fill="#1ed760"/><path d="M7 25l1-6 6 3z" fill="#1ed760"/><g fill="#000"><rect x="9" y="12" width="2.6" height="7" rx="1.3"/><rect x="13" y="9" width="2.6" height="12" rx="1.3"/><rect x="17" y="7" width="2.6" height="16" rx="1.3"/><rect x="21" y="10" width="2.6" height="10" rx="1.3"/></g></svg>聊天關係報告</div>
 <nav id="nav">
  <button data-v="start" class="on"><svg viewBox="0 0 24 24"><path d="M12 3l9 8h-3v9h-5v-6h-2v6H6v-9H3z"/></svg><span>開始分析</span></button>
  <button data-v="over" disabled><svg viewBox="0 0 24 24"><path d="M4 13h4v7H4zm6-9h4v16h-4zm6 5h4v11h-4z"/></svg><span>總覽</span></button>
  <button data-v="fore" disabled><svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8v4h2V4h-7v2h4l-7 7-4-4-8 8z"/></svg><span>未來預測</span></button>
  <button data-v="chart" disabled><svg viewBox="0 0 24 24"><path d="M3 3h8v8H3zm10 0h8v8h-8zM3 13h8v8H3zm10 0h8v8h-8z"/></svg><span>圖表</span></button>
  <button data-v="hist"><svg viewBox="0 0 24 24"><path d="M13 3a9 9 0 0 0-9 9H1l3.9 3.9L9 12H6a7 7 0 1 1 2.1 5l-1.4 1.4A9 9 0 1 0 13 3zm-1 5v5l4.3 2.5.7-1.2-3.5-2V8z"/></svg><span>歷史紀錄</span></button>
  <button data-v="exp" disabled><svg viewBox="0 0 24 24"><path d="M12 3v10.2l3.6-3.6L17 11l-5 5-5-5 1.4-1.4 3.6 3.6V3zM5 18h14v3H5z"/></svg><span>匯出</span></button>
 </nav>
 <div class="sp"></div>
 <div class="priv">資料只在這台電腦處理，不會上傳。</div>
 <button class="quit" id="quit"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M13 3h-2v10h2zm4.8 2.2l-1.4 1.4A7 7 0 1 1 7.6 6.6L6.2 5.2A9 9 0 1 0 17.8 5.2z"/></svg><span>結束程式</span></button>
</aside>
<main id="main">
 <section class="view on" id="v-start">
  <div class="hero plain"><div><h1>看懂你們的聊天</h1><div class="meta">匯入 LINE 或 Instagram 的聊天記錄，算出親密度、關係區間，以及未來 1 週（早期）或 8 週的走向。</div></div></div>
  <div class="body">
   <h2>匯入聊天記錄</h2>
   <div class="drop" id="drop"><b>拖曳檔案到這裡，或點擊選擇</b>LINE：.txt　Instagram：message_1.json 等（可多選，兩個平台可合併）<input id="file" type="file" multiple hidden></div>
   <div class="files" id="flist"></div>
   <h2>設定（可略過）</h2>
   <div class="grid">
    <div><label for="me">你的名字</label><input id="me" placeholder="與聊天室顯示的名字相同"></div>
    <div><label for="exclude">排除機器人或系統帳號</label><input id="exclude" placeholder="多個用逗號分開"></div>
    <div><label for="alias">合併兩個平台的名字</label><input id="alias" placeholder="IG名=LINE名"></div>
    <div><label for="since">只分析從</label><input type="date" id="since"></div>
    <div><label for="until">到（不含當天）</label><input type="date" id="until"></div>
    <div><label for="tz">時區（台灣是 8）</label><input id="tz" value="8"></div>
    <div><label for="c_met">怎麼認識的（選填）</label><select id="c_met"><option value="">不指定</option><option value="online_blind_date">線上盲約／配對活動</option><option value="street">搭訕</option><option value="matchmaking">相親</option><option value="family">家人介紹</option><option value="friend">朋友介紹</option><option value="was_friend">原本就是朋友</option><option value="new">剛認識（同學、活動等自然認識）</option></select></div><div><label for="c_stage">見面進度（選填）</label><select id="c_stage"><option value="">不指定</option><option value="not_met_no_sns">還沒見面，也沒交換其他社群帳號</option><option value="not_met_sns">還沒見面，但已交換社群帳號</option><option value="met">已經見面</option></select></div><div><label for="c_br">感情狀態（選填）</label><select id="c_br"><option value="">不指定</option><option value="one">有一方剛失戀</option><option value="both">兩方都剛失戀</option></select></div>
    <div><label for="label">這次的備註（選填）</label><input id="label" placeholder="例如：期中考前"></div>
   </div>
   <h2>儲存位置</h2>
   <div id="store" class="card" style="max-width:720px"></div>
   <div class="play" style="margin-top:28px"><button class="go" id="go" disabled>開始分析</button><span class="status" id="status"></span></div>
   <p class="note">只看文字內容；電話和見面看不到，分數是下限估計。本工具不做診斷，只描述聊天裡看得到的行為。</p>
  </div>
 </section>
 <section class="view" id="v-over"></section>
 <section class="view" id="v-fore"></section>
 <section class="view" id="v-chart"></section>
 <section class="view" id="v-hist"></section>
 <section class="view" id="v-exp"></section>
</main>
<div class="lb" id="lb"><img id="lbimg" alt=""></div>
<script>
const T=new URLSearchParams(location.search).get('t'),$=id=>document.getElementById(id);let uploaded=[],has=false;
const api=(p,o)=>fetch(p+(p.includes('?')?'&':'?')+'t='+T,o);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
setInterval(()=>api('/ping').catch(()=>{}),4000);api('/ping');
function show(v){document.querySelectorAll('.view').forEach(e=>e.classList.toggle('on',e.id==='v-'+v));
 document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));$('main').scrollTop=0}
$('nav').onclick=e=>{const b=e.target.closest('button');if(b&&!b.disabled){show(b.dataset.v);if(b.dataset.v==='hist')loadHist()}};
$('quit').onclick=async()=>{if(confirm('結束程式？分析結果會一併清除。')){await api('/quit',{method:'POST'}).catch(()=>{});document.body.innerHTML='<div class="empty" style="width:100%"><b>已結束</b>可以關閉這個視窗。</div>'}};
$('drop').onclick=()=>$('file').click();
['dragover','dragenter'].forEach(e=>$('drop').addEventListener(e,ev=>{ev.preventDefault();$('drop').classList.add('on')}));
['dragleave','drop'].forEach(e=>$('drop').addEventListener(e,ev=>{ev.preventDefault();$('drop').classList.remove('on')}));
$('drop').addEventListener('drop',ev=>send(ev.dataTransfer.files));$('file').onchange=ev=>send(ev.target.files);
async function send(fs){await api('/reset',{method:'POST'});uploaded=[];$('flist').innerHTML='<span class="status"><span class="spin"></span>讀取中…</span>';
 for(const f of fs){const r=await api('/upload?name='+encodeURIComponent(f.name),{method:'POST',body:await f.arrayBuffer()});if(r.ok)uploaded.push(f.name)}
 $('flist').innerHTML=uploaded.map(n=>'<span class="chip">'+esc(n)+'</span>').join('');$('go').disabled=!uploaded.length}
$('go').onclick=async()=>{$('go').disabled=true;$('status').innerHTML='<span class="spin"></span>分析中，大型聊天可能要一分鐘';
 const body={};['me','exclude','alias','since','until','tz','label'].forEach(k=>body[k]=$(k).value.trim());body.ctx={met:$('c_met').value,stage:$('c_stage').value,breakup:$('c_br').value};
 let d;try{const r=await api('/run',{method:'POST',body:JSON.stringify(body)});d=await r.json()}catch(e){d={error:'連不到程式，請重新開啟 App。'}}
 $('go').disabled=false;$('status').textContent='';render(d);if(d.saved_run){$('status').textContent='已存入歷史紀錄';loadStore()}};
function bar(v,lo,hi){return '<div class="track"><i style="width:'+v+'%"></i>'+(lo!=null?'<em style="left:'+lo+'%;width:'+Math.max(1,hi-lo)+'%"></em>':'')+'</div>'}
function earlyHtml(e){
 const CL={'降溫':'c-cool','升溫':'c-warm','持平':'c-flat','資料不足':'c-na'},rk=e.risk_label||'',pj=e.projection||{},nx=pj.next_7d_msgs_per_day||{};
 let h='<h2>早期判斷：未來 1 週會不會涼掉？</h2><p class="sub">曖昧期變化很快，所以只比較最近 '+e.window_days+' 天和前 '+e.window_days+' 天，不需要等 8 週。這是啟發式判斷，不是預言。</p>';
 h+='<div class="cards"><div class="card"><b>'+esc(rk)+'</b><span>涼掉風險<br>降溫 '+e.cool_signals+'・升溫 '+e.warm_signals+'</span></div>';
 h+='<div class="card"><b>'+pj.recent_7d_msgs_per_day+'</b><span>最近 7 天每日訊息</span></div><div class="card"><b>'+nx.p50+'</b><span>未來 7 天每日訊息<br>('+nx.p10+'–'+nx.p90+')</span></div><div class="card"><b>'+Math.round(100*pj.fade_risk_7d)+'%</b><span>再掉到最近水位 3 成以下的機率</span></div></div>';
 h+='<table class="tbl"><tr><th>訊號</th><th>類型</th><th>最近</th><th>先前</th><th>判讀</th></tr>'+(e.signals||[]).map(x=>'<tr class="row"><td>'+esc(x.name)+(x.note?'<br><small style="opacity:.6">'+esc(x.note)+'</small>':'')+'</td><td>'+esc(x.kind)+'</td><td>'+(x.recent??'—')+'</td><td>'+(x.prior??'—')+'</td><td><span class="evchip '+(CL[x.call]||'c-flat')+'">'+esc(x.call)+'</span></td></tr>').join('')+'</table>';
 h+='<div class="alert"><h3>判斷依據與限制</h3>'+(e.caveats||[]).map(w=>'<div>'+esc(w)+'</div>').join('')+'<div style="opacity:.7">'+esc(e.rule||'')+'</div></div>';
 return h}
function bandShown(s){const c=s.context;return(c&&/^not_met/.test(c.stage||'')&&s.band.indexOf('情侶／伴侶')===0)?s.band.replace('情侶／伴侶','互動熱絡・尚未見面（不等於交往）'):s.band}
function render(d){
 if(d.error){$('status').innerHTML='<span style="color:var(--bad)">'+esc(d.error)+'</span>';return}
 const s=d.score,st=d.stats,f=d.forecast;has=true;
 document.querySelectorAll('#nav button').forEach(b=>{b.disabled=false});if(!f)document.querySelector('[data-v=fore]').disabled=false;
 const W=[].concat(s.warnings||[],d.notes||[]);
 const names=Object.entries(st.people).map(([k,v])=>'<b>'+esc(k)+'</b> '+v+' 則').join('　');
 let h='<div class="hero"><div class="cover"><b>'+s.closeness+'</b><span>親密度 / 100</span></div><div><h1>'+esc(bandShown(s))+'</h1><div class="meta">'+names+'<br>信心「'+esc(s.confidence)+'」・趨勢「'+esc(s.trend)+'」・'+esc(st.span[0].slice(0,10))+' 到 '+esc(st.span[1].slice(0,10))+'</div></div></div><div class="body">';
 if(s.context){h+='<div class="alert"><h3>對話情境：'+esc((s.context.labels||[]).join('、'))+'</h3>'+(s.context.notes||[]).map(w=>'<div>'+esc(w)+'</div>').join('')+((s.context.adjustments||[]).length?'<div><b>有調整的地方：</b>'+(s.context.adjustments||[]).map(esc).join('；')+'</div>':'<div>沒有調整任何分數，只影響解讀。</div>')+'<div style="opacity:.7">情境由你標註，沒有任何情境的權重經台灣資料校準。</div></div>'}
