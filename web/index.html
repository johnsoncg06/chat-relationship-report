<style>

.pct{font-weight:800;white-space:nowrap}.pct small{color:var(--dim);font-weight:400}
.cur{color:var(--dim);font-weight:400;font-size:12px;margin-left:6px}

.dim{display:grid;grid-template-columns:70px 1fr 40px;gap:12px;align-items:center;margin:11px 0}.dim .track{height:8px}.dim b{text-align:right}

.empty{text-align:center;color:var(--mute);padding:70px 20px}.empty b{display:block;color:#fff;font-size:20px;margin-bottom:6px}

.wc .mb{height:8px;border-radius:8px;background:rgba(255,255,255,.28);margin:6px 0;overflow:hidden}.wc .mb i{display:block;height:100%;background:#fff;border-radius:8px}

 if(!r.projects.length)g+='<div class="empty"><b>還沒有對象</b>先建立一個對象，之後在「開始分析」選擇歸到哪個對象；已存的紀錄可以在下方指定。</div>';
 const act=r.projects.filter(p=>p.latest);if(!PSEL){PSEL=new Set();act.forEach(p=>PSEL.add(p.id))}
 g+='<div class="cards">'+r.projects.map((p,i)=>{const l=p.latest;return '<div class="card" style="border-left:4px solid '+PC[i%PC.length]+'"><div style="display:flex;justify-content:space-between;gap:8px"><label style="display:flex;gap:8px;align-items:center;font-weight:600;color:#fff;margin:0"><input type="checkbox" class="psel" data-id="'+p.id+'" style="width:auto"'+(PSEL.has(p.id)?' checked':'')+(l?'':' disabled')+'>'+esc(p.name)+'</label><span style="white-space:nowrap"><button class="mini prn" data-id="'+p.id+'" data-n="'+esc(p.name)+'">改名</button> <button class="mini pdel" data-id="'+p.id+'">刪除</button></span></div>'+
   (l?'<b style="margin-top:10px">'+l.closeness+'</b><span>親密度・'+esc(l.band.replace(/（僅供參考.*/,''))+'<br>'+p.n+' 筆紀錄・最近 '+fdate(l.saved_at).slice(0,10)+'</span>':'<span style="display:block;margin-top:10px">還沒有紀錄</span>')+'</div>'}).join('')+'</div>';
 const sel=r.projects.map((p,i)=>({p,c:PC[i%PC.length]})).filter(x=>x.p.latest&&PSEL.has(x.p.id));
 if(sel.length<2)g+='<p class="note">勾選兩個以上有紀錄的對象，才會顯示並排比較。</p>';
 else{
  g+='<h2>並排比較（各對象最新一筆）</h2><div style="overflow-x:auto"><table class="hist cmp"><tr><th>指標</th>'+sel.map(x=>'<th style="color:'+x.c+'">'+esc(x.p.name)+'</th>').join('')+'</tr>';
  const row=(n,f)=>'<tr class="row"><td>'+n+'</td>'+sel.map(x=>'<td>'+f(x.p.latest,x.p.latest.digest||{})+'</td>').join('')+'</tr>';
  g+=row('分析時間',l=>fdate(l.saved_at))+row('資料量',l=>(l.total||'-')+' 則'+(Array.isArray(l.span)?'・'+String(l.span[0]).slice(0,10)+' ～ '+String(l.span[1]).slice(0,10):''))+row('親密度',l=>'<b>'+l.closeness+'</b>')+row('浪漫訊號',l=>l.romantic)+row('關係區間',l=>esc((l.band||'').replace(/（僅供參考.*/,'')))+row('趨勢',l=>esc(l.trend||'-'))+row('信心',l=>esc(l.confidence||'-'))+
   row('預測模式',(l,d)=>d.mode==='early'?'早期（1 週）':d.mode==='full'?'完整（'+esc(d.horizon)+'）':'未做預測')+
   row('涼掉／淡出風險',(l,d)=>d.mode==='early'?'<b>'+esc(d.risk||'-')+'</b>（再掉到近期水位 3 成以下 '+Math.round(100*(d.fade||0))+'%）':d.mode==='full'?Math.round(100*(d.fade||0))+'%（4 週）':'-')+
   row('預測第一名情境',(l,d)=>d.mode==='full'?esc(d.top)+' '+Math.round(d.top_pct)+'%':'-')+
   row('近期訊息量',(l,d)=>d.recent!=null?d.recent+' '+d.unit:'-')+row('預測訊息量',(l,d)=>d.next_p50!=null?d.next_p50+' '+d.unit:'-')+
   row('對話情境',l=>{const c=l.context||{};const lb=(id,v)=>{const o=[...$(id).options].find(o=>o.value===v);return o?o.text:v};return esc([c.met&&lb('c_met',c.met),c.stage&&lb('c_stage',c.stage),c.breakup&&lb('c_br',c.breakup)].filter(Boolean).join('、')||'未標註')})+'</table></div>';
  g+='<p class="note">不同對象的「分數」不能直接當作誰比較喜歡你：每段關係的聊天量、見面頻率、認識方式都不同。比較的重點是各自的趨勢與風險，以及早期模式（1 週）和完整模式（8 週）的預測不是同一把尺，表中已分開標示。</p>';
  const cs=sel.map(x=>({c:x.c,pts:x.p.runs.map(r=>[D(r.saved_at),r.closeness]),dots:true,name:x.p.name}));let xs=cs.flatMap(s=>s.pts.map(p=>p[0]));let a=Math.min(...xs),b=Math.max(...xs);if(a===b){a-=3;b+=3}
  g+='<h2>親密度隨時間</h2>'+legendHtml(sel)+lineChart(900,260,cs,{xmin:a,xmax:b,ymin:0,ymax:100,xf:dfmt,yf:v=>Math.round(v)});
  const ws=[];sel.forEach(x=>{const d=x.p.latest.digest||{},wk=Object.entries(d.weekly||{}).sort().slice(-26);if(!wk.length)return;const pts=wk.map(([k,v])=>[D(k),v]);ws.push({c:x.c,pts});
   if(d.future&&d.future.length){const f=d.future.map(q=>[D(q.date),q.p50]);ws.push({c:x.c,dash:true,pts:[pts[pts.length-1]].concat(f),band:d.future.map(q=>[D(q.date),q.p90]).concat(d.future.map(q=>[D(q.date),q.p10]).reverse())})}});
  if(ws.length){const ax=ws.flatMap(s=>s.pts.map(p=>p[0])),ay=ws.flatMap(s=>s.pts.map(p=>p[1]).concat((s.band||[]).map(p=>p[1])));
   g+='<h2>每週訊息量與預測</h2><p class="sub">實線＝實際，虛線＝預測中位數，淡色帶＝80% 區間。早期模式的對象沒有每週預測，只畫實際。</p>'+legendHtml(sel)+lineChart(900,280,ws,{xmin:Math.min(...ax),xmax:Math.max(...ax),ymin:0,ymax:Math.max(...ay)*1.1||1,xf:dfmt,yf:v=>Math.round(v)})}}
 const al=r.projects.filter(p=>(p.alerts||[]).length);if(al.length)g+='<h2>提醒與建議</h2>'+al.map(p=>'<h3 style="margin:14px 0 4px">'+esc(p.name)+'</h3>'+alertsHtml({alerts:p.alerts,note:''},1)).join('')+'<p class="note">提醒是規則式啟發式，沒用台灣資料驗證；它指出值得看一下的變化，不是預言。</p>';
 if(r.unassigned.length){g+='<h2>未分組的紀錄</h2><p class="sub">舊紀錄或沒指定對象的紀錄。指定後就會出現在對象裡。</p><table class="hist"><tr><th>時間</th><th>參與者</th><th>親密度</th><th>歸到</th></tr>'+r.unassigned.map(u=>'<tr class="row"><td>'+fdate(u.saved_at)+'</td><td>'+esc(u.people.join(' × '))+'</td><td>'+u.closeness+'</td><td><select class="asg" data-id="'+u.id+'"><option value="">不分組</option>'+r.projects.map(p=>'<option value="'+p.id+'">'+esc(p.name)+'</option>').join('')+'</select></td></tr>').join('')+'</table>'}
 el.innerHTML=g+'</div>';
 $('addp').onclick=async()=>{const x=await J('/api/project_create',{name:$('newp').value});if(x.error){$('pmsg').textContent=x.error;return}loadProj()};
 el.querySelectorAll('.psel').forEach(c=>c.onchange=()=>{c.checked?PSEL.add(c.dataset.id):PSEL.delete(c.dataset.id);loadProj()});
 el.querySelectorAll('.prn').forEach(b=>b.onclick=async()=>{const n=prompt('新的名稱',b.dataset.n);if(n){const x=await J('/api/project_rename',{id:b.dataset.id,name:n});if(x.error||x.ok===false)alert('無法改名（名稱空白或重複）');loadProj()}});
 el.querySelectorAll('.pdel').forEach(b=>b.onclick=async()=>{if(confirm('刪除這個對象？裡面的紀錄不會被刪，會變成「未分組」。')){await J('/api/project_delete',{id:b.dataset.id});PSEL=null;loadProj()}});
 el.querySelectorAll('.asg').forEach(s=>s.onchange=async()=>{await J('/api/run_assign',{id:s.dataset.id,project:s.value});loadProj()})}
async function loadMe(){const el=$('v-me'),r=await J('/api/personal');
 let g='<div class="hero plain"><div><h1>個人檔案</h1><div class="meta">從你這一側的行為，看你在這些聊天裡的經營方式，以及隨時間的變化</div></div></div><div class="body">';
 if(!r.folder){el.innerHTML=g+'<div class="empty"><b>還沒有選儲存位置</b>到「開始分析」頁最下方選一個資料夾，累積紀錄後這裡才有東西可看。</div></div>';return}
 if(!r.n_used){el.innerHTML=g+'<div class="empty"><b>還沒有可用的紀錄</b>分析時要填「你的名字」（和聊天室顯示的名字相同），才知道哪一側是你；而且只支援兩人聊天。'+(r.n_runs?'目前 '+r.n_runs+' 筆紀錄都缺少這個資訊。':'')+'</div></div>';return}
 const A=r.archetype,PCs={};(r.projects||[]).forEach((p,i)=>PCs[p.id]=PC[i%PC.length]);const col=id=>PCs[id]||'#b3b3b3';
 g+='<div class="card" style="max-width:760px;border-left:4px solid #1ed760"><span>目前的傾向（啟發式，玩笑成分高）</span><b style="margin:6px 0 8px;font-size:34px">'+esc(A.label)+'</b><div style="color:#fff">'+esc(A.tagline)+'</div><ul style="margin:12px 0 0;padding-left:18px;color:var(--mute);font-size:13.5px">'+A.evidence.map(e=>'<li>'+esc(e)+'</li>').join('')+'</ul></div>';
 g+='<div class="alert" style="margin-top:14px"><h3>怎麼看這個標籤</h3><div>這只描述「你在這幾段聊天裡看得到的行為」，不是性格，也不是道德評價。看不到你的動機、對方知不知情、有沒有見面或打電話，也不知道哪些其實只是朋友。標籤規則和門檻是我們自己定的，沒有用台灣資料驗證過；段數越少越不穩。我刻意不用「渣男」這種帶定罪意味的字。</div></div>';
 const ov=r.overall||[];
 g+='<div class="cards" style="margin-top:14px"><div class="card"><b>'+A.avg_score+'</b><span>你這側的經營分<br>（0–100，啟發式）</span></div><div class="card"><b>'+r.n_used+'</b><span>納入的紀錄</span></div><div class="card"><b>'+A.active+'</b><span>目前同時活躍的關係</span></div>'+(r.slope_label?'<div class="card"><b>'+esc(r.slope_label)+'</b><span>經營分趨勢<br>'+(r.slope_per_30d>0?'+':'')+r.slope_per_30d+' 分／30 天</span></div>':'')+'</div>';
 if(r.skipped)g+='<p class="note">另有 '+r.skipped+' 筆紀錄沒納入（沒填你的名字、群組，或資料太少算不出經營分）。</p>';
 const xs=r.runs.map(q=>D(q.end)),a=Math.min(...xs),b=Math.max(...xs)||a+1,pad=a===b?3:0;
 g+='<h2>你的進步曲線（以聊天發生的日期為準）</h2><p class="sub">白線＝各對象「到那天為止最新一筆」的平均；彩色點＝各對象。經營分由四項組成：回覆及時（30）、回應對方的邀請與提問（30）、主動平衡（20）、表達投入（20）。它量的是互動的「可靠度」，不是魅力，也不保證關係會成功。</p>';
 const byp={};r.runs.forEach(q=>(byp[q.project]=byp[q.project]||[]).push(q));
 const nm={};r.runs.forEach(q=>nm[q.project]=q.name);const ids=Object.keys(byp);
 const mk=f=>ids.map(id=>({c:col(id),pts:byp[id].map(q=>[D(q.end),f(q)]),dots:true}));
 const sers=[{c:'#ffffff',pts:ov.map(o=>[D(o.date),o.score]),dots:false}].concat(mk(q=>q.score));
 g+='<div style="display:flex;gap:16px;flex-wrap:wrap;margin:6px 0 8px;font-size:13px"><span><i style="display:inline-block;width:10px;height:10px;border-radius:5px;background:#fff;margin-right:6px"></i>整體</span>'+ids.map(id=>'<span><i style="display:inline-block;width:10px;height:10px;border-radius:5px;background:'+col(id)+';margin-right:6px"></i>'+esc(nm[id])+'</span>').join('')+'</div>'+lineChart(900,260,sers,{xmin:a-pad,xmax:b+pad,ymin:0,ymax:100,xf:dfmt,yf:v=>Math.round(v)});
 g+='<h2>各專案的進步曲線（親密度）</h2><p class="sub">同樣以日期為橫軸；同一個對象要有兩筆以上紀錄才會有線。</p>'+lineChart(900,260,mk(q=>q.closeness),{xmin:a-pad,xmax:b+pad,ymin:0,ymax:100,xf:dfmt,yf:v=>Math.round(v)});
 g+='<h2>各專案進步一覽</h2><div style="overflow-x:auto"><table class="hist cmp"><tr><th>對象</th><th>紀錄數</th><th>期間</th><th>你的經營分</th><th>親密度</th><th>最近 4 週量／高峰</th></tr>'+r.progress.map(p=>{const d1=p.score_last-p.score_first,d2=p.closeness_last-p.closeness_first,sg=v=>v>0?'up':v<0?'dn':'';return '<tr class="row"><td style="color:'+col(p.project)+'">'+esc(p.name)+'</td><td>'+p.n+'</td><td>'+(p.days?p.days+' 天':'—')+'</td><td>'+(p.n>1?p.score_first+' → '+p.score_last+' <b class="'+sg(d1)+'">('+(d1>0?'+':'')+d1+')</b>':p.score_last)+'</td><td>'+(p.n>1?p.closeness_first+' → '+p.closeness_last+' <b class="'+sg(d2)+'">('+(d2>0?'+':'')+d2+')</b>':p.closeness_last)+'</td><td>'+(p.last.ratio!=null?Math.round(100*p.last.ratio)+'%':'—')+'</td></tr>'}).join('')+'</table></div><p class="note">綠色＝上升、紅色＝下降。分數變化在 5 分內不要過度解讀；紀錄少、聊天量小的時候，曲線的起伏大多是雜訊。</p>';
 el.innerHTML=g+'</div>'}
function legendHtml(sel){return '<div style="display:flex;gap:16px;flex-wrap:wrap;margin:6px 0 8px;font-size:13px">'+sel.map(x=>'<span><i style="display:inline-block;width:10px;height:10px;border-radius:5px;background:'+x.c+';margin-right:6px"></i>'+esc(x.p.name)+'</span>').join('')+'</div>'}
loadStore().then(fillProj);
document.addEventListener('click',e=>{const i=e.target.closest('.imgs img');if(i){$('lbimg').src=i.src;$('lb').classList.add('on')}else if(e.target.closest('#lb'))$('lb').classList.remove('on')});
